<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("akamonkai.theme"); } catch {}
        const theme = saved === "light" || saved === "dark" ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#101827" : "#f5f7fb");
      })();
    </script>
    <meta
      name="description"
      content="赤門会日本語 — 教材に沿った語彙・文法・読解の復習。"
    />
    <title>赤門会日本語</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
