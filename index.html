<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width,initial-scale=1.0,viewport-fit=cover" name="viewport"/>
    <meta content="#ffffff" name="theme-color"/>
    <script>
        (() => {
            let saved;
            try {
                saved = localStorage.getItem("akamonkai.theme");
            } catch {
            }
            const theme = saved === "light" || saved === "dark" ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0a0a0a" : "#ffffff");
            // 放大倍率也要在首帧前套上，否则会先按默认字号闪一下再跳大。
            try {
                const scale = Number(localStorage.getItem("akamonkai.text-scale"));
                // 与 textScaleRange 一致：25%–250% 之外当作没存，落在 25% 的格子上。
                if (scale >= 0.25 && scale <= 2.5) document.documentElement.style.setProperty("--font-scale", String(Math.round(scale * 4) / 4));
            } catch {
            }
        })();
    </script>
    <meta
            content="赤門会日本語 — 教材に沿った語彙・文法・読解の復習。"
            name="description"
    />
    <title>赤門会日本語</title>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
