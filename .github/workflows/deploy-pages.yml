name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check and build
        run: pnpm build
      # 交互、布局和语音引擎调用只有真浏览器能证明，静态断言覆盖不到。
      # 跑构建产物（preview），与线上部署的是同一份文件。
      - name: End-to-end browser checks
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo "runner 上没有 Chrome，无法跑端到端检查" >&2
            exit 1
          fi
          pnpm preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          # preview 跑的是生产构建，base 为 /Akamonkai-learning/（vite.config.ts），
          # 根路径只会 302，所以探测和 E2E_BASE 都要带这个前缀。
          preview_url=http://127.0.0.1:4173/Akamonkai-learning/
          for _ in $(seq 1 60); do
            if curl -sf "$preview_url" | grep -q akamonkai.theme; then break; fi
            sleep 1
          done
          if ! curl -sf "$preview_url" | grep -q akamonkai.theme; then
            echo "preview 服务器没起来：$preview_url" >&2
            cat "$RUNNER_TEMP/preview.log" >&2
            exit 1
          fi
          E2E_BASE="${preview_url%/}" \
          E2E_CHROME="$chrome" \
          E2E_NO_SANDBOX=1 \
            pnpm e2e
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: logs/e2e-*.png
          if-no-files-found: ignore
      - name: Check Android adapters and publication
        run: pnpm android:test
      # 证书不对直接失败；APK 落后于网页只出警告，网站照常发布。
      - name: Check published APK against this build
        run: node scripts/verify-apk.mjs --dist=dist
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    # 只让部署彼此排队；PR 的构建不进这个组，不必等正在进行的部署。
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
