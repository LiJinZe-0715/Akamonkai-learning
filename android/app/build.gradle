plugins { id 'com.android.application' }

// 签名口令与别名单独放一份，和 keystore 一起随仓库走（换电脑也能签出可覆盖安装的包）。
// 缺文件时 Gradle 会在打包阶段报密码为空，而不是悄悄签出一个调试包。
def keystorePropertiesFile = rootProject.file('signing/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'app.study.mobile'
    compileSdk 35
    buildFeatures { buildConfig = true }
    // 默认规则会丢掉以 _ 开头的目录；网页资源一个都不能少，所以只排除版本库与系统杂项。
    androidResources { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
    defaultConfig {
        applicationId 'app.study.akamonkai'
        minSdk 26
        targetSdk 35
        // 两个版本号都写死，不再参与任何判断：个人项目的历史会被重写，递增版本号只是
        // 在编一个没人看的故事。「线上是不是另一个包」由 APK 的 sha256 回答。
        // 注意 versionCode 只能升不能降：已经装了更高版本的设备必须先卸载才能装这个包。
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'UPDATE_BASE_URL', '"https://lijinze-0715.github.io/Akamonkai-learning/downloads/"'
        buildConfigField 'String', 'UPDATE_APK_NAME', '"Akamonkai-learning.apk"'
        // 手机端日语 TTS 引擎：壳自己下载再交给系统安装器，网页只能请求「装引擎」，
        // 递不了任意地址进来。浏览器用的同一个地址写在 src/presentation/components/speech-engine-link.ts，
        // 两边不一致 pnpm check 会报。
        buildConfigField 'String', 'ENGINE_APK_URL', '"https://github.com/LiJinZe-0715/Akamonkai-learning/releases/download/voice/VoiceVox_TTS.apk"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            storeFile file('../signing/debug.keystore')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }
    buildTypes {
        // 发的是 release 包（不可调试、R8 压缩），但签名沿用同一把钥匙：证书不变，
        // 已装的设备可以直接覆盖安装。证书指纹登记在 android/release-signing.json。
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
}
